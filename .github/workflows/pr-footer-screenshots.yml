name: PR footer screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PI_VERSION: 0.84.3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screenshot dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund \
            tsx@4.20.6 \
            @mariozechner/pi-tui@0.73.1 \
            @earendil-works/pi-tui@0.84.3
          python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Render footer states
        run: |
          npx --no-install tsx .github/scripts/capture-footer.ts .artifacts/footer
          python .github/scripts/render-footer-screenshots.py .artifacts/footer

      - uses: actions/upload-artifact@v4
        with:
          name: footer-screenshots
          path: .artifacts/footer/*.png
          if-no-files-found: error
          retention-days: 7
